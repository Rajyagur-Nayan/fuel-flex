version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: fuelflux-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fuelflux
    volumes:
      - mongo-data:/data/db
    networks:
      - fuelflux-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuelflux-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Fuelflux
      - ENVIRONMENT=development
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=fuelflux
      - SECRET_KEY=fuelflux-enterprise-secret-key-change-in-prod
    volumes:
      - ./backend/public/uploads:/app/public/uploads
      - ./data:/app/data
    depends_on:
      - mongodb
    networks:
      - fuelflux-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fuelflux-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - fuelflux-network

volumes:
  mongo-data:

networks:
  fuelflux-network:
    driver: bridge
